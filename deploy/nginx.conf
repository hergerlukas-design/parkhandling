server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css text/markdown application/javascript application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Unveränderliche, gehashte Build-Dateien
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Dateien, die für den Update-Flow immer frisch sein müssen
  location ~ ^/(sw\.js|workbox-.*\.js|version\.json|CHANGELOG\.md|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    types { text/markdown md; application/json json; application/javascript js; application/manifest+json webmanifest; text/html html; }
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
