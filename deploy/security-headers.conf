# Sicherheits-Header für alle Antworten. Wird in JEDEM location-Block eingebunden, weil nginx
# add_header der Server-Ebene verwirft, sobald ein location-Block eigene add_header setzt.
#
# CSP: Skripte nur von der eigenen Domain; Daten, Fotos (Signed URLs) und Realtime von Supabase;
# Schrift von Google Fonts. 'unsafe-inline' nur für Styles (React style-Attribute).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob:; connect-src 'self' blob: data: https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Kamera für Fotos und QR-Scan; alles andere aus
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
