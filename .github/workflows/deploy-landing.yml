name: Landingpage (Fly.io)

# Eigener Workflow für die Landingpage in landing/ (eigene Fly-App, eigene Version).
# Läuft NUR bei Änderungen unter landing/** oder supabase/** (gemeinsames Supabase-Projekt).
# Ein Push, der nur die interne App betrifft, löst diesen Workflow nicht aus – und umgekehrt
# ignoriert deploy.yml Änderungen unter landing/**.
#
# Das Deployment ist vorbereitet, aber standardmäßig AUS. Einschalten, sobald die Fly-App
# angelegt ist: Repository-Variable LANDING_DEPLOY_ENABLED = true
# (Settings → Secrets and variables → Actions → Variables). Secret FLY_API_TOKEN wie bei der internen App.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'supabase/**'
      - '.github/workflows/deploy-landing.yml'
  pull_request:
    paths:
      - 'landing/**'
      - 'supabase/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: landing

jobs:
  check:
    name: Typecheck, Tests, Build, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  edge-function:
    name: Edge Function inquiry-submit (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-lock inquiry-submit/
      - run: deno check --no-lock inquiry-submit/index.ts

  deploy:
    name: Fly.io
    needs: [check, edge-function]
    if: github.event_name != 'pull_request' && vars.LANDING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Secret vorhanden?
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Secret FLY_API_TOKEN fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Build-Kontext ist nur landing/ (Dockerfile und fly.toml liegen dort)
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
