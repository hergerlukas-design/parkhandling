name: Deploy (Fly.io)

# Jeder Merge bzw. Push auf main wird geprüft und auf Fly.io ausgeliefert.
# PRs auf main werden nur geprüft (inkl. Migrationsstand), nicht ausgeliefert.
# Voraussetzung: Repository-Secrets FLY_API_TOKEN (erzeugen mit `fly tokens create deploy`) und SUPABASE_DB_URL.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nie zwei Deployments gleichzeitig; ein neuerer Push ersetzt einen wartenden. PRs laufen getrennt davon.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'deploy-fly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Frontend nur ausliefern, wenn die Datenbank alle Migrationen aus dem Repo hat (Issue #9)
  migrations:
    name: Migrationsstand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrationen in der Datenbank eingespielt?
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL fehlt (Settings → Secrets and variables → Actions). Verbindungs-URI des Session-Poolers aus Supabase → Connect."
            exit 1
          fi
          ./scripts/check-migrations.sh

  deploy:
    name: Fly.io
    needs: [check, migrations]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Secret vorhanden?
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Secret FLY_API_TOKEN fehlt (Settings → Secrets and variables → Actions). Token mit 'fly tokens create deploy' erzeugen."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Image wird auf Fly gebaut (Dockerfile); die App läuft nur, wenn /version.json antwortet (Health-Check in fly.toml)
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
