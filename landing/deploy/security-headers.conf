# Wird in jeder location eingebunden (add_header in einer location ersetzt die des server-Blocks).
# Bis Datenschutzerklärung, Impressum und Aufbewahrungsfrist geklärt sind: nicht indexieren
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Skripte, Styles und Bilder nur von hier; Verbindungen zu Supabase; PayPal nur auf der Buchungsseite
# (SDK und Bezahl-Buttons). Keine weiteren Drittanbieter.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.paypal.com; style-src 'self'; img-src 'self' data: https://www.paypal.com; connect-src 'self' https://*.supabase.co https://www.paypal.com; frame-src https://www.paypal.com https://*.paypal.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
