# Wird in jeder location eingebunden (add_header in einer location ersetzt die des server-Blocks).
# Bis Datenschutzerklärung, Impressum und Aufbewahrungsfrist geklärt sind: nicht indexieren
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Keine Drittanbieter: Skripte, Styles und Bilder nur von hier, Verbindungen nur zu Supabase
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
