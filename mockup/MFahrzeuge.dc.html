<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Park &amp; Fly mobil – Fahrzeuge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F1ED;font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;color:#1A1D21}
a{color:#0E5E6F}a:hover{color:#0A4652}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F1ED; overflow: hidden;">

<header style="flex-shrink: 0; padding: 14px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #DDD8D0; display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 20px; font-weight: 700;">Fahrzeuge</span>
<label style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #F3F1ED; border-radius: 10px;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5750" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" aria-label="Suche" placeholder="Kennzeichen oder Kunde" style="flex-grow: 1; border: none; outline: none; background: transparent; font-size: 15px;">
</label>
<div style="display: flex; gap: 6px; overflow: hidden;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" style="flex-shrink: 0; height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px; border: 1px solid {{c.bc}}; background: {{c.bg}}; color: {{c.tx}};">{{c.label}}</button>
</sc-for>
</div>
</header>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<a href="MFahrzeug.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 12px; background: #FFFFFF; border-radius: 12px; color: #1A1D21; text-decoration: none;">
<span style="width: 6px; align-self: stretch; border-radius: 3px; background: {{r.dot}};"></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<div style="display: flex; justify-content: space-between; gap: 8px;"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600;">{{r.plate}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4A463F;">{{r.loc}}</span></div>
<span style="font-size: 13px; color: #4A463F;">{{r.model}}</span>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px;"><span style="font-weight: 600;">{{r.pickup}}</span><span style="color: {{r.openTx}};">{{r.open}}</span></div>
</div>
</a>
</sc-for>
</main>

<nav aria-label="Navigation" style="height: 76px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: #FFFFFF; border-top: 1px solid #DDD8D0;">
<a href="MHeute.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Heute</a>
<a href="MLageplan.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>Lageplan</a>
<a href="MScan.dc.html" aria-label="Scannen" style="justify-self: center; width: 56px; height: 56px; border-radius: 28px; background: #0E5E6F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 4px 12px rgba(14,94,111,0.35);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3M21 14v.01M14 21h7v-4"></path></svg></a>
<a href="MFahrzeuge.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #0E5E6F; font-size: 11px; font-weight: 600; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16v-3l2-5h14l2 5v3z"></path><circle cx="7.5" cy="17" r="2"></circle><circle cx="16.5" cy="17" r="2"></circle></svg>Fahrzeuge</a>
<a href="MAufgaben.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"></path><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11"></path><circle cx="5" cy="18" r="1.5"></circle></svg>Aufgaben</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var DOT = { today: '#B42318', tomorrow: '#B54708', week: '#1D5F8A', later: '#2F6B4F' };
    var raw = [
      ['M-PF 214', 'VW ID.4', 'R1-E1', 'heute 14:30', 'today', 0],
      ['M-AU 5520', 'Porsche Taycan', 'R3-E1', 'heute 17:00', 'today', 1],
      ['LA-WE 318', 'Opel Astra', 'B1-06', 'heute 15:00', 'today', 0],
      ['EBE-T 402', 'Tesla Model Y', 'R2-E1', 'morgen 07:45', 'tomorrow', 1],
      ['M-XY 11', 'Mercedes GLC', 'R6-E1', 'morgen 12:00', 'tomorrow', 0],
      ['M-KA 881', 'BMW X3', 'R1-E2', '25.09. 09:00', 'week', 1],
      ['DAH-K 92', 'Mini Cooper SE', 'R5-E2', '26.09. 19:50', 'week', 1],
      ['STA-J 18', 'Skoda Superb', 'R3-E2', '28.09. 11:20', 'week', 2],
      ['FS-MA 330', 'BMW i5', 'R4-E3', '01.10. 13:40', 'later', 2],
      ['M-RS 6', 'Audi RS 6', 'R3-E3', '05.10. 08:00', 'later', 5]
    ];
    function chip(label, active) { return { label: label, bg: active ? '#1A1D21' : '#FFFFFF', tx: active ? '#FFFFFF' : '#1A1D21', bc: active ? '#1A1D21' : '#C9C4BC' }; }
    return {
      chips: [chip('Alle 51', true), chip('Heute raus 11', false), chip('Halle 17', false), chip('Offen 19', false)],
      rows: raw.map(function (r) {
        return { plate: r[0], model: r[1], loc: r[2], pickup: 'Abholung ' + r[3], dot: DOT[r[4]],
          open: r[5] ? r[5] + ' Leistungen offen' : 'fertig', openTx: r[5] ? '#B54708' : '#2F6B4F' };
      })
    };
  }
}
</script>
</body>
</html>
