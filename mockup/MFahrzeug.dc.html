<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F1ED; overflow: hidden;">

<span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FCEBD3; color: #6E2C04;">in Arbeit</span>

<sc-for list="{{services}}" as="s" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px;">
<sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6B4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"></path></svg></sc-if>
<sc-if value="{{s.open}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B54708" stroke-width="2"><circle cx="12" cy="12" r="7"></circle></svg></sc-if>
<div style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px;">{{s.name}}</span><span style="font-size: 11px; color: {{s.metaTx}};">{{s.meta}}</span></div>
</div>
</sc-for>
</section>

<section style="background: #FFFFFF; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px;">

<div style="display: flex; justify-content: space-between;"><span style="color: #5B5750;">Kunde</span><span>[Kundenname]</span></div>
<div style="display: flex; justify-content: space-between;"><span style="color: #5B5750;">Annahme</span><span style="color: #2F6B4F; font-weight: 600;">unterschrieben 17.09.</span></div>

<a href="MScan.dc.html" style="flex: 1; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #0E5E6F; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none;">Auschecken</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function s(name, done, meta) { return { name: name, done: done, open: !done, meta: meta, metaTx: done ? '#5B5750' : '#B54708' }; }
    return {
      services: [
        s('Grundreinigung', true, '17.09. · 4 Fotos'),
        s('Aufbereitung innen', true, '17.09. · 6 Fotos'),
        s('Aufbereitung außen', true, '17.09. · 8 Fotos'),
        s('Laden', false, 'Akku 41 % · fällig vor 16:30')
      ]
    };
  }
}
</script>
</body>
