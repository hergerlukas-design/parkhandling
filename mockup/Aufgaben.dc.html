<a href="Aufgaben.dc.html" style="width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; background: #2E343B; color: #FFFFFF; font-size: 11px; font-weight: 600; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"></path><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11"></path><circle cx="5" cy="18" r="1.5"></circle></svg>Aufgaben</a>
<a href="Shuttle.dc.html" style="width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; color: #C9C4BC; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"></rect><path d="M4 10h16"></path><circle cx="8" cy="19.5" r="1.5"></circle><circle cx="16" cy="19.5" r="1.5"></circle></svg>Shuttle</a>

<main style="flex-grow: 1; min-width: 0; padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; gap: 8px; align-items: center;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid {{c.bc}}; background: {{c.bg}}; color: {{c.tx}};">{{c.label}}</button>
</sc-for>
<div style="flex-grow: 1;"></div>
<span style="font-size: 13px; color: #5B5750;">Sortiert nach Fälligkeit</span>
</div>

<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="3">
<section style="background: #E6E2DB; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px;"><h2 style="margin: 0; font-size: 15px;">{{col.title}}</h2><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4A463F;">{{col.count}}</span></div>
<sc-for list="{{col.cards}}" as="t" hint-placeholder-count="4">
<a href="Fahrzeug.dc.html" style="background: #FFFFFF; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; color: #1A1D21; text-decoration: none; border: 1px solid {{t.border}};">
<div style="display: flex; align-items: center; gap: 8px;">
<span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: {{t.typeBg}}; color: {{t.typeTx}};">{{t.type}}</span>
<span style="flex-grow: 1;"></span>
<span style="font-size: 12px; font-weight: 600; color: {{t.dueTx}};">{{t.due}}</span>
</div>
<span style="font-size: 14px; font-weight: 600; line-height: 1.35;">{{t.title}}</span>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5B5750;">
<span style="font-family: 'IBM Plex Mono', monospace; color: #1A1D21;">{{t.plate}}</span><span>·</span><span>{{t.loc}}</span><span style="flex-grow: 1;"></span><span>{{t.meta}}</span>
</div>
</a>
</sc-for>
</section>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    var TYPES = {
      clean: ['Aufbereitung', '#DEEAF3', '#123E5C'],
      charge: ['Laden', '#E2ECE5', '#1C4531'],
      fuel: ['Tanken', '#E2ECE5', '#1C4531'],
      move: ['Umsetzen', '#FBE4E1', '#7A1A12'],
      service: ['Service', '#EEEBE6', '#4A463F']
    };
    function card(type, title, plate, loc, due, urgent, meta) {
      var t = TYPES[type];
      return { type: t[0], typeBg: t[1], typeTx: t[2], title: title, plate: plate, loc: loc, due: due, dueTx: urgent ? '#B42318' : '#4A463F', meta: meta, border: type === 'move' ? '#E7B3AC' : '#FFFFFF' };
    }
    function chip(label, active) {
      return { label: label, bg: active ? '#1A1D21' : '#FFFFFF', tx: active ? '#FFFFFF' : '#1A1D21', bc: active ? '#1A1D21' : '#C9C4BC' };
    }
    return {
      chips: [chip('Alle', true), chip('Aufbereitung', false), chip('Laden/Tanken', false), chip('Umsetzen', false), chip('Service', false), chip('Nur heute fällig', false)],
      cols: [
        { title: 'Offen', count: '14', cards: [
          card('charge', 'Laden bis 80 %', 'M-AU 5520', 'R3-E1', 'bis 16:30', true, 'Akku 41 %'),
          card('move', 'R5: DAH-K 92 nach vorn umsetzen', 'DAH-K 92', 'R5-E2', 'bis 26.09.', true, '2 Bewegungen'),
          card('charge', 'Laden bis 80 %', 'EBE-T 402', 'R2-E1', 'bis 24.09. 07:00', false, 'Akku 58 %'),
          card('clean', 'Grundreinigung', 'ERD-GO 471', 'A2-04', 'bis 29.09.', false, 'Standard')
        ] },
        { title: 'In Arbeit', count: '3', cards: [
          card('clean', 'Aufbereitung außen', 'M-KA 881', 'Aufbereitung 1', 'bis 24.09.', false, 'Mitarbeiter 3'),
          card('fuel', 'Volltanken', 'STA-J 18', 'Unterwegs Tankstelle', 'bis 27.09.', false, 'Mitarbeiter 1'),
          card('service', 'Scheibenwischer tauschen', 'ED-S 450', 'Aufbereitung 2', 'bis 25.09.', false, 'Mitarbeiter 2')
        ] },
        { title: 'Erledigt heute', count: '6', cards: [
          card('clean', 'Aufbereitung innen', 'M-PF 214', 'R1-E1', '10:15', false, '5 Fotos'),
          card('charge', 'Laden bis 80 %', 'M-PF 214', 'R1-E1', '09:40', false, '82 %'),
          card('clean', 'Grundreinigung', 'M-XY 11', 'R6-E1', '08:55', false, '4 Fotos')
        ] }
      ]
    };
  }
}
</script>
