<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Park &amp; Fly mobil – Aufgaben</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F1ED;font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;color:#1A1D21}
a{color:#0E5E6F}a:hover{color:#0A4652}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F1ED; overflow: hidden;">

<header style="flex-shrink: 0; padding: 14px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #DDD8D0; display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 20px; font-weight: 700;">Aufgaben</span>
<div style="display: flex; gap: 4px; padding: 4px; background: #E6E2DB; border-radius: 12px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" style="flex: 1; height: 38px; border: none; border-radius: 9px; font-size: 13px; font-weight: 600; background: {{t.bg}}; color: {{t.tx}};">{{t.label}}</button>
</sc-for>
</div>
</header>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
<a href="MFahrzeug.dc.html" style="padding: 12px; background: #FFFFFF; border-radius: 12px; border: 1px solid {{c.border}}; display: flex; flex-direction: column; gap: 6px; color: #1A1D21; text-decoration: none;">
<div style="display: flex; align-items: center; gap: 8px;">
<span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: {{c.typeBg}}; color: {{c.typeTx}};">{{c.type}}</span>
<span style="flex-grow: 1;"></span>
<span style="font-size: 12px; font-weight: 600; color: {{c.dueTx}};">{{c.due}}</span>
</div>
<span style="font-size: 15px; font-weight: 600;">{{c.title}}</span>
<div style="display: flex; gap: 8px; font-size: 12px; color: #5B5750;"><span style="font-family: 'IBM Plex Mono', monospace; color: #1A1D21;">{{c.plate}}</span><span>·</span><span>{{c.loc}}</span><span style="flex-grow: 1;"></span><span>{{c.meta}}</span></div>
</a>
</sc-for>
</main>

<nav aria-label="Navigation" style="height: 76px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: #FFFFFF; border-top: 1px solid #DDD8D0;">
<a href="MHeute.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Heute</a>
<a href="MLageplan.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>Lageplan</a>
<a href="MScan.dc.html" aria-label="Scannen" style="justify-self: center; width: 56px; height: 56px; border-radius: 28px; background: #0E5E6F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 4px 12px rgba(14,94,111,0.35);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3M21 14v.01M14 21h7v-4"></path></svg></a>
<a href="MFahrzeuge.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16v-3l2-5h14l2 5v3z"></path><circle cx="7.5" cy="17" r="2"></circle><circle cx="16.5" cy="17" r="2"></circle></svg>Fahrzeuge</a>
<a href="MAufgaben.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #0E5E6F; font-size: 11px; font-weight: 600; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"></path><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11"></path><circle cx="5" cy="18" r="1.5"></circle></svg>Aufgaben</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'open' };
  }
  renderVals() {
    var self = this;
    var TYPES = {
      clean: ['Aufbereitung', '#DEEAF3', '#123E5C'], charge: ['Laden', '#E2ECE5', '#1C4531'],
      fuel: ['Tanken', '#E2ECE5', '#1C4531'], move: ['Umsetzen', '#FBE4E1', '#7A1A12'], service: ['Service', '#EEEBE6', '#4A463F']
    };
    function card(type, title, plate, loc, due, urgent, meta) {
      var t = TYPES[type];
      return { type: t[0], typeBg: t[1], typeTx: t[2], title: title, plate: plate, loc: loc, due: due, dueTx: urgent ? '#B42318' : '#4A463F', meta: meta, border: type === 'move' ? '#E7B3AC' : '#FFFFFF' };
    }
    var DATA = {
      open: [
        card('charge', 'Laden bis 80 %', 'M-AU 5520', 'R3-E1', 'bis 16:30', true, 'Akku 41 %'),
        card('move', 'R5 umsetzen', 'DAH-K 92', 'R5-E2', 'bis 26.09.', true, '2 Bewegungen'),
        card('charge', 'Laden bis 80 %', 'EBE-T 402', 'R2-E1', 'bis 24.09.', false, 'Akku 58 %'),
        card('clean', 'Grundreinigung', 'ERD-GO 471', 'A2-04', 'bis 29.09.', false, 'Standard'),
        card('clean', 'Aufbereitung innen', 'FS-BC 902', 'Pufferzone', 'bis 03.10.', false, 'Premium')
      ],
      doing: [
        card('clean', 'Aufbereitung außen', 'M-KA 881', 'Aufbereitung 1', 'bis 24.09.', false, 'Mitarbeiter 3'),
        card('fuel', 'Volltanken', 'STA-J 18', 'unterwegs', 'bis 27.09.', false, 'Mitarbeiter 1'),
        card('service', 'Scheibenwischer tauschen', 'ED-S 450', 'Aufbereitung 2', 'bis 25.09.', false, 'Mitarbeiter 2')
      ],
      done: [
        card('clean', 'Aufbereitung innen', 'M-PF 214', 'R1-E1', '10:15', false, '5 Fotos'),
        card('charge', 'Laden bis 80 %', 'M-PF 214', 'R1-E1', '09:40', false, '82 %'),
        card('clean', 'Grundreinigung', 'M-XY 11', 'R6-E1', '08:55', false, '4 Fotos')
      ]
    };
    var tab = this.state.tab;
    var tabs = [['open', 'Offen 14'], ['doing', 'In Arbeit 3'], ['done', 'Erledigt 6']].map(function (t) {
      var a = tab === t[0];
      return { label: t[1], bg: a ? '#FFFFFF' : 'transparent', tx: a ? '#1A1D21' : '#4A463F', pick: function () { self.setState({ tab: t[0] }); } };
    });
    return { tabs: tabs, cards: DATA[tab] };
  }
}
</script>
</body>
</html>
