<div style="width: 1194px; height: 834px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F1ED; overflow: hidden;">

<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: #FFFFFF; border-bottom: 1px solid #DDD8D0; box-sizing: border-box;">

<span style="font-size: 14px; color: #5B5750; margin-left: 6px;">Mi, 23.09.2026</span>
<div style="flex-grow: 1;"></div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #F3F1ED; font-size: 13px;"><span style="font-weight: 600;">Halle</span><span style="font-family: 'IBM Plex Mono', monospace;">17/24</span></div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #F3F1ED; font-size: 13px;"><span style="font-weight: 600;">Außen</span><span style="font-family: 'IBM Plex Mono', monospace;">34/48</span></div>
<a href="Checkin.dc.html" style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 10px; background: #0E5E6F; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3M21 14v.01M14 21h7v-4"></path></svg>Scannen</a>
</header>

<div style="flex-grow: 1; display: flex; min-height: 0;">
<nav aria-label="Hauptnavigation" style="width: 76px; flex-shrink: 0; background: #1A1D21; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 14px; box-sizing: border-box;">
<a href="Heute.dc.html" style="width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; color: #C9C4BC; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Heute</a>
<a href="Main.dc.html" style="width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; color: #C9C4BC; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>Lageplan</a>
<a href="Fahrzeuge.dc.html" style="width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; background: #2E343B; color: #FFFFFF; font-size: 11px; font-weight: 600; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16v-3l2-5h14l2 5v3z"></path><circle cx="7.5" cy="17" r="2"></circle><circle cx="16.5" cy="17" r="2"></circle></svg>Fahrzeuge</a>
<a href="Aufgaben.dc.html" style="width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; color: #C9C4BC; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"></path><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11"></path><circle cx="5" cy="18" r="1.5"></circle></svg>Aufgaben</a>
<a href="Shuttle.dc.html" style="width: 64px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; color: #C9C4BC; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"></rect><path d="M4 10h16"></path><circle cx="8" cy="19.5" r="1.5"></circle><circle cx="16" cy="19.5" r="1.5"></circle></svg>Shuttle</a>
<a href="Einstellungen.dc.html" style="width: 64px; height: 60px; margin-top: auto; margin-bottom: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; color: #C9C4BC; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Setup</a>
</nav>

<main style="flex-grow: 1; min-width: 0; padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: center; gap: 10px;">
<label style="flex-grow: 1; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #FFFFFF; border: 1px solid #C9C4BC; border-radius: 10px; box-sizing: border-box;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5750" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Suche</span>
<input type="search" placeholder="Kennzeichen, Kunde oder Buchungsnummer" style="flex-grow: 1; border: none; outline: none; font-size: 14px; background: transparent;">
</label>
<button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #C9C4BC; border-radius: 10px; background: #FFFFFF; font-size: 14px;">Buchungen importieren</button>
<a href="Checkin.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 16px; border-radius: 10px; background: #0E5E6F; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none;">+ Buchung anlegen</a>
</div>

<div style="display: flex; gap: 8px; flex-wrap: wrap;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid {{c.bc}}; background: {{c.bg}}; color: {{c.tx}};">{{c.label}} <span style="font-family: 'IBM Plex Mono', monospace; margin-left: 4px;">{{c.count}}</span></button>
</sc-for>
</div>

<section style="flex-grow: 1; min-height: 0; background: #FFFFFF; border: 1px solid #DDD8D0; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;">
<div style="display: grid; grid-template-columns: 120px 150px 110px 130px 130px minmax(0, 1fr) 110px; gap: 12px; padding: 10px 16px; font-size: 12px; font-weight: 600; color: #4A463F; border-bottom: 1px solid #DDD8D0; background: #FAF9F7;">
<span>Kennzeichen</span><span>Fahrzeug</span><span>Ort</span><span>Zeitraum</span><span>Abholung</span><span>Leistungen</span><span>Status</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<a href="Fahrzeug.dc.html" style="display: grid; grid-template-columns: 120px 150px 110px 130px 130px minmax(0, 1fr) 110px; gap: 12px; align-items: center; min-height: 52px; padding: 0 16px; font-size: 13px; color: #1A1D21; text-decoration: none; border-bottom: 1px solid #EEEBE6;">
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">{{r.plate}}</span>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.model}}</span>
<span style="font-family: 'IBM Plex Mono', monospace;">{{r.loc}}</span>
<span>{{r.range}}</span>
<span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{r.dot}};"></span>{{r.pickup}}</span>
<span style="display: flex; gap: 4px; flex-wrap: wrap;">
<sc-for list="{{r.tags}}" as="t" hint-placeholder-count="2">
<span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; background: {{t.bg}}; color: {{t.tx}};">{{t.label}}</span>
</sc-for>
</span>
<span style="justify-self: start; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{r.stBg}}; color: {{r.stTx}};">{{r.status}}</span>
</a>
</sc-for>
</section>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    var DOT = { today: '#B42318', tomorrow: '#B54708', week: '#1D5F8A', later: '#2F6B4F' };
    var ST = {
      stored: ['eingelagert', '#DEEAF3', '#123E5C'],
      service: ['in Arbeit', '#FCEBD3', '#6E2C04'],
      ready: ['bereit', '#E2ECE5', '#1C4531'],
      transit: ['unterwegs', '#1A1D21', '#FFFFFF']
    };
    var raw = [
      ['M-PF 214', 'VW ID.4', 'R1-E1', '16.09.–23.09.', 'heute 14:30', 'today', 'I+ L+', 'ready'],
      ['M-AU 5520', 'Porsche Taycan', 'R3-E1', '17.09.–23.09.', 'heute 17:00', 'today', 'I+ A+ L-', 'service'],
      ['LA-WE 318', 'Opel Astra', 'B1-06', '18.09.–23.09.', 'heute 15:00', 'today', '', 'ready'],
      ['EBE-T 402', 'Tesla Model Y', 'R2-E1', '20.09.–24.09.', 'morgen 07:45', 'tomorrow', 'L-', 'stored'],
      ['M-XY 11', 'Mercedes GLC', 'R6-E1', '17.09.–24.09.', 'morgen 12:00', 'tomorrow', 'I+', 'ready'],
      ['M-KA 881', 'BMW X3', 'R1-E2', '18.09.–25.09.', '25.09. 09:00', 'week', 'A-', 'stored'],
      ['DAH-K 92', 'Mini Cooper SE', 'R5-E2', '21.09.–26.09.', '26.09. 19:50', 'week', 'I-', 'stored'],
      ['STA-J 18', 'Skoda Superb', 'R3-E2', '22.09.–28.09.', '28.09. 11:20', 'week', 'T-', 'stored'],
      ['FS-MA 330', 'BMW i5', 'R4-E3', '22.09.–01.10.', '01.10. 13:40', 'later', 'L-', 'stored'],
      ['M-RS 6', 'Audi RS 6', 'R3-E3', '20.09.–05.10.', '05.10. 08:00', 'later', 'I- A- P- S-', 'stored'],
      ['ERD-GO 471', 'Kia EV6', 'A2-04', '23.09.–30.09.', '30.09. 10:00', 'later', 'L-', 'stored']
    ];
    var NAMES = { I: 'Innen', A: 'Außen', P: 'Politur', L: 'Laden', T: 'Tanken', S: 'Service' };
    var rows = raw.map(function (r) {
      var tags = [{ label: 'Grundreinigung', bg: '#EEEBE6', tx: '#4A463F' }];
      if (r[6]) r[6].split(' ').forEach(function (t) {
        var done = t.charAt(1) === '+';
        tags.push({ label: NAMES[t.charAt(0)] + (done ? ' ✓' : ''), bg: done ? '#E2ECE5' : '#FCEBD3', tx: done ? '#1C4531' : '#6E2C04' });
      });
      var st = ST[r[7]];
      return { plate: r[0], model: r[1], loc: r[2], range: r[3], pickup: r[4], dot: DOT[r[5]], tags: tags, status: st[0], stBg: st[1], stTx: st[2] };
    });
    function chip(label, count, active) {
      return { label: label, count: count, bg: active ? '#1A1D21' : '#FFFFFF', tx: active ? '#FFFFFF' : '#1A1D21', bc: active ? '#1A1D21' : '#C9C4BC' };
    }
    return {
      rows: rows,
      chips: [chip('Alle', 51, true), chip('Halle', 17, false), chip('Außen', 34, false), chip('Heute raus', 11, false), chip('Offene Leistungen', 19, false), chip('Laden/Tanken', 8, false)]
    };
  }
}
</script>
</body>
</html>
