<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Park &amp; Fly – Fahrer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F1ED;font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;color:#1A1D21}
a{color:#0E5E6F}a:hover{color:#0A4652}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F1ED; overflow: hidden;">

<header style="padding: 20px 18px 14px; background: #1A1D21; color: #FFFFFF; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 12px; color: #C9C4BC;">Fahrer 1 · Shuttle-Bus 1</span>
<span style="font-size: 20px; font-weight: 700;">Meine Fahrten</span>
</header>

<main style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
<section style="background: #FFFFFF; border: 2px solid #0E5E6F; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 8px;">
<span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: #DEEAF3; color: #123E5C;">Jetzt</span>
<span style="font-size: 12px; color: #5B5750;">Abfahrt in 20 Min</span>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600;">13:00</span>
<span style="font-size: 16px; font-weight: 600;">Shuttle → Terminal 1 und 2</span>
<div style="display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{pax}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 10px; background: #F3F1ED; font-size: 14px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">{{p.plate}}</span>
<span style="flex-grow: 1; color: #4A463F;">{{p.pers}}</span>
<span style="font-weight: 600;">{{p.term}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 8px; margin-top: 4px;">
<button type="button" style="flex: 1; height: 52px; border: none; border-radius: 12px; background: #0E5E6F; color: #FFFFFF; font-size: 16px; font-weight: 600;">Losgefahren</button>
<button type="button" style="width: 52px; height: 52px; border: 1px solid #C9C4BC; border-radius: 12px; background: #FFFFFF;" aria-label="Anrufen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1D21" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></button>
</div>
</section>

<h2 style="margin: 4px 2px 0; font-size: 14px; color: #4A463F;">Danach</h2>
<sc-for list="{{next}}" as="n" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid {{n.border}}; border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600;">{{n.time}}</span>
<div style="flex-grow: 1; display: flex; flex-direction: column;">
<span style="font-size: 14px; font-weight: 600;">{{n.title}}</span>
<span style="font-size: 12px; color: {{n.metaTx}};">{{n.meta}}</span>
</div>
</article>
</sc-for>
</main>

<nav aria-label="Fahrer-Navigation" style="height: 72px; flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DDD8D0;">
<a href="Fahrer.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #0E5E6F; font-size: 11px; font-weight: 600; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"></rect><path d="M4 10h16"></path><circle cx="8" cy="19.5" r="1.5"></circle><circle cx="16" cy="19.5" r="1.5"></circle></svg>Fahrten</a>
<a href="Checkin.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3M21 14v.01M14 21h7v-4"></path></svg>Scannen</a>
<a href="Protokoll.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h5"></path></svg>Protokoll</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function n(time, title, meta, warn) { return { time: time, title: title, meta: meta, metaTx: warn ? '#B42318' : '#5B5750', border: warn ? '#E7B3AC' : '#DDD8D0' }; }
    return {
      pax: [
        { plate: 'M-LU 552', pers: '2 Pers.', term: 'T1' },
        { plate: 'FS-HN 219', pers: '2 Pers.', term: 'T2' },
        { plate: 'EBE-RT 88', pers: '1 Pers.', term: 'T2' }
      ],
      next: [
        n('13:25', 'Rückfahrt vom Terminal', '3 Personen · 2 Abholungen', false),
        n('14:00', 'Shuttle → Terminal 1 und 2', '2 Personen · 1 Fahrzeug', false),
        n('16:30', 'Vallet M-AU 5520', 'Halle R3-E1 → Terminal 1 · Laden noch offen', true)
      ]
    };
  }
}
</script>
</body>
</html>
