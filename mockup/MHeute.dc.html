<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Park &amp; Fly mobil – Heute</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F1ED;font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;color:#1A1D21}
a{color:#0E5E6F}a:hover{color:#0A4652}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F1ED; overflow: hidden;">

<header style="flex-shrink: 0; padding: 14px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #DDD8D0; display: flex; align-items: center; justify-content: space-between;">
<div style="display: flex; flex-direction: column;"><span style="font-size: 20px; font-weight: 700;">Heute</span><span style="font-size: 12px; color: #5B5750;">Mi, 23.09.2026 · 12:40</span></div>
<a href="Einstellungen.dc.html" aria-label="Einstellungen" style="width: 44px; height: 44px; border-radius: 22px; background: #F3F1ED; display: flex; align-items: center; justify-content: center; color: #1A1D21;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></a>
</header>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<a href="{{k.href}}" style="padding: 12px; background: #FFFFFF; border: 1px solid {{k.border}}; border-radius: 12px; display: flex; flex-direction: column; gap: 2px; color: #1A1D21; text-decoration: none;">
<span style="font-size: 12px; color: #4A463F;">{{k.label}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700; color: {{k.color}};">{{k.value}}</span>
</a>
</sc-for>
</div>

<a href="MFahrzeug.dc.html" style="display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: #FCEBD3; color: #6E2C04; text-decoration: none; font-size: 13px; line-height: 1.4;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg>
<span><strong>M-AU 5520 · 17:00</strong><br>Laden noch offen, Vallet startet 16:30.</span>
</a>

<a href="Shuttle.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: #1A1D21; color: #FFFFFF; text-decoration: none;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"></rect><path d="M4 10h16"></path><circle cx="8" cy="19.5" r="1.5"></circle><circle cx="16" cy="19.5" r="1.5"></circle></svg>
<div style="display: flex; flex-direction: column;"><span style="font-size: 11px; color: #C9C4BC;">Nächster Shuttle</span><span style="font-size: 15px; font-weight: 600;">13:00 · 5 Personen · 3 Fahrzeuge</span></div>
</a>

<h2 style="margin: 4px 2px 0; font-size: 15px;">Ablauf</h2>
<sc-for list="{{events}}" as="e" hint-placeholder-count="6">
<a href="MFahrzeug.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #FFFFFF; border-radius: 12px; color: #1A1D21; text-decoration: none; opacity: {{e.opacity}};">
<div style="width: 50px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600;">{{e.time}}</span>
<span style="padding: 1px 6px; border-radius: 5px; font-size: 10px; font-weight: 600; background: {{e.kindBg}}; color: {{e.kindTx}};">{{e.kind}}</span>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600;">{{e.plate}}</span>
<span style="font-size: 12px; color: #5B5750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{e.info}}</span>
</div>
<span style="width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: {{e.dot}};"></span>
</a>
</sc-for>
</main>

<nav aria-label="Navigation" style="height: 76px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: #FFFFFF; border-top: 1px solid #DDD8D0;">
<a href="MHeute.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #0E5E6F; font-size: 11px; font-weight: 600; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Heute</a>
<a href="MLageplan.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>Lageplan</a>
<a href="MScan.dc.html" aria-label="Scannen" style="justify-self: center; width: 56px; height: 56px; border-radius: 28px; background: #0E5E6F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 4px 12px rgba(14,94,111,0.35);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3M21 14v.01M14 21h7v-4"></path></svg></a>
<a href="MFahrzeuge.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16v-3l2-5h14l2 5v3z"></path><circle cx="7.5" cy="17" r="2"></circle><circle cx="16.5" cy="17" r="2"></circle></svg>Fahrzeuge</a>
<a href="MAufgaben.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4A463F; font-size: 11px; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"></path><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11"></path><circle cx="5" cy="18" r="1.5"></circle></svg>Aufgaben</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var DOT = { done: '#ABA398', ready: '#2F6B4F', open: '#B54708', expected: '#1D5F8A' };
    var raw = [
      ['11:30', 'in', 'ERD-GO 471', 'Shuttle · eingelagert A2-04', 'done'],
      ['13:00', 'in', '3 Fahrzeuge', 'Shuttle-Slot · Annahme vorbereiten', 'expected'],
      ['14:30', 'out', 'M-PF 214', 'Vallet Terminal 2 · R1-E1 · bereit', 'ready'],
      ['15:00', 'out', 'LA-WE 318', 'Shuttle · B1-06 · bereit', 'ready'],
      ['16:20', 'in', 'FS-BC 902', 'Premium · Vorschlag R7-E3', 'expected'],
      ['17:00', 'out', 'M-AU 5520', 'Vallet Terminal 1 · Laden offen', 'open'],
      ['18:00', 'out', 'DAH-PS 655', 'Shuttle · A1-09 · bereit', 'ready']
    ];
    return {
      kpis: [
        { label: 'Ankünfte', value: '9', href: 'MLageplan.dc.html', color: '#1A1D21', border: '#DDD8D0' },
        { label: 'Abholungen', value: '11', href: 'MFahrzeuge.dc.html', color: '#1A1D21', border: '#DDD8D0' },
        { label: 'Offene Aufgaben', value: '23', href: 'MAufgaben.dc.html', color: '#1A1D21', border: '#DDD8D0' },
        { label: 'Umsetzen', value: '1', href: 'MLageplan.dc.html', color: '#B42318', border: '#E7B3AC' }
      ],
      events: raw.map(function (r) {
        var isIn = r[1] === 'in';
        return { time: r[0], kind: isIn ? 'Ankunft' : 'Abholung', plate: r[2], info: r[3], dot: DOT[r[4]],
          kindBg: isIn ? '#DEEAF3' : '#1A1D21', kindTx: isIn ? '#123E5C' : '#FFFFFF', opacity: r[4] === 'done' ? '0.55' : '1' };
      })
    };
  }
}
</script>
</body>
</html>
